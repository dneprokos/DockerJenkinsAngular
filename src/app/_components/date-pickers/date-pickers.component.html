<div class="page-container">
  <img src="assets/images/date-page/planet-bg.jpg" alt="Decorative planet" class="date-bg-planet" />
  <mat-card>
    <mat-card-title class="card-title">Date Pickers Example</mat-card-title>
    <div class="date-picker-group">
      <mat-form-field appearance="fill">
        <mat-label>Choose a date</mat-label>
        <input matInput [matDatepicker]="picker1" [(ngModel)]="date1" name="date1">
        <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
        <mat-datepicker #picker1></mat-datepicker>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Choose another date</mat-label>
        <input matInput [matDatepicker]="picker2" [(ngModel)]="date2" name="date2">
        <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
        <mat-datepicker #picker2></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="info-label">Date 1: {{ date1 | date }}</div>
    <div class="info-label">Date 2: {{ date2 | date }}</div>
    <div class="date-range-section">
      <div class="card-title" style="font-size: 1.1rem; margin-top: 1.5rem; margin-bottom: 0.5rem;">Date Range Picker</div>
      <mat-form-field appearance="fill" class="example-form-field" style="width: 100%;">
        <mat-label>Enter a date range</mat-label>
        <mat-date-range-input [rangePicker]="rangePicker">
          <input matStartDate placeholder="Start date">
          <input matEndDate placeholder="End date">
        </mat-date-range-input>
        <mat-datepicker-toggle matSuffix [for]="rangePicker"></mat-datepicker-toggle>
        <mat-date-range-picker #rangePicker>
          <mat-date-range-picker-actions>
            <button mat-button matDateRangePickerCancel>Cancel</button>
            <button mat-raised-button color="primary" matDateRangePickerApply>Apply</button>
          </mat-date-range-picker-actions>
        </mat-date-range-picker>
      </mat-form-field>
    </div>
    <!-- Removed the clock image -->
  </mat-card>
</div>
