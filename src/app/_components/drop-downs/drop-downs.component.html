<div class="page-container">
  <div class="dropdowns-grid">
    <mat-card>
      <mat-card-title>mat-select</mat-card-title>
      <mat-form-field appearance="fill" class="dropdown-field">
        <mat-label>Favorite food</mat-label>
        <mat-select [(value)]="selectedValue">
          <mat-option *ngFor="let food of foods" [value]="food.value">
            {{food.viewValue}}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <div class="selected-label">Selected food: {{selectedValue}}</div>
    </mat-card>

    <mat-card>
      <mat-card-title>Native html select</mat-card-title>
      <mat-form-field appearance="fill" class="dropdown-field">
        <mat-label>Favorite car</mat-label>
        <mat-select [(value)]="selectedCar">
          <mat-option *ngFor="let car of cars" [value]="car.value">
            {{car.viewValue}}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <div class="selected-label">Selected car: {{selectedCar}}</div>
    </mat-card>
  </div>
</div>
