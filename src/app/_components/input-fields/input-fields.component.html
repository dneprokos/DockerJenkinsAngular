<div class="page-container">
  <mat-card>
    <mat-card-title>Input Fields Example</mat-card-title>
    <form class="input-form">
      <div class="input-fields-grid">
        <mat-form-field appearance="fill">
          <mat-label>First Name</mat-label>
          <input matInput [(ngModel)]="firstName" name="firstName">
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Last Name</mat-label>
          <input matInput [(ngModel)]="lastName" name="lastName">
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Primary Programming Language</mat-label>
          <input matInput [(ngModel)]="primaryProgrammingLanguage" name="primaryProgrammingLanguage">
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Other Programming Languages</mat-label>
          <input matInput [(ngModel)]="otherProgrammingLenguages" name="otherProgrammingLenguages">
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Years of Experience</mat-label>
          <input matInput [(ngModel)]="yearsExperience" name="yearsExperience">
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>City</mat-label>
          <input matInput [(ngModel)]="city" name="city">
        </mat-form-field>
      </div>
      <mat-form-field appearance="fill" class="resume-field">
        <mat-label>Short Resume</mat-label>
        <textarea matInput [(ngModel)]="shortResume" name="shortResume" rows="3"></textarea>
      </mat-form-field>
      <div class="form-actions">
        <button mat-raised-button color="primary" (click)="print()">Print Resume</button>
      </div>
    </form>
  </mat-card>
</div>
