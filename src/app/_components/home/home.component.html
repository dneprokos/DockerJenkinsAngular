<div class="page-container">
  <mat-grid-list class="home-title" cols="1" rowHeight="100px">
    <mat-grid-tile>
      <h1>Test website designed for the automation practice. I know, site design is painful.
        <i class="material-icons">sentiment_very_satisfied</i>
      </h1>
    </mat-grid-tile>
  </mat-grid-list>

  <ngu-carousel #carousel [inputs]="carouselConfig" [dataSource]="images">
    <div *nguCarouselDef="let item" class="item">
      <div class="image-container">
        <img [src]="item" alt="Carousel image" class="docker-image"/>
      </div>
    </div>
    <button NguCarouselPrev class="leftRs">&lt;</button>
    <button NguCarouselNext class="rightRs">&gt;</button>

    <ul class="myPoint" NguCarouselPoint>
        <li *ngFor="let i of carousel.pointNumbers" [class.active]="i==carousel.activePoint" (click)="carousel.moveTo(i)"></li>
    </ul>
  </ngu-carousel>

  <mat-grid-list cols="2" rowHeight="2:2" gutterSize="20px">
    <mat-grid-tile [colspan]="1" [rowspan]="2">
      <div class="text">{{ dockerText }}</div>
    </mat-grid-tile>
    <mat-grid-tile [colspan]="1" [rowspan]="2">
      <div class="text">{{ jenkinsText }}</div>
    </mat-grid-tile>
  </mat-grid-list>
</div>
