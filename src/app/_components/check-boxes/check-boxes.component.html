<div class="page-container">
  <mat-card>
    <mat-card-title class="card-title">Check Boxes Example</mat-card-title>
    <form [formGroup]="toppings" class="checkbox-group">
      <mat-checkbox formControlName="pepperoni">Pepperoni</mat-checkbox>
      <mat-checkbox formControlName="extracheese">Extra Cheese</mat-checkbox>
      <mat-checkbox formControlName="mushroom">Mushroom</mat-checkbox>
    </form>
    <div class="info-label">Selected: {{ toppings.value | json }}</div>
  </mat-card>

  <mat-card>
    <mat-card-title class="card-title">Task List</mat-card-title>
    <div class="checkbox-group">
      <mat-checkbox [(ngModel)]="allComplete" (change)="setAll($event.checked)">
        {{task.name}}
      </mat-checkbox>
    </div>
    <div class="checkbox-group" style="margin-left: 24px;">
      <mat-checkbox *ngFor="let subtask of task.subtasks" [(ngModel)]="subtask.completed" (change)="updateAllComplete()">
        {{subtask.name}}
      </mat-checkbox>
    </div>
    <div class="info-label">All complete: {{ allComplete }}</div>
    <div class="info-label">Some complete: {{ someComplete() }}</div>
  </mat-card>
</div>
