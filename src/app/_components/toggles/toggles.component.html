<div class="page-container">
  <mat-card>
    <mat-card-title class="card-title">Toggles Example</mat-card-title>
    <div class="toggle-group">
      <mat-slide-toggle [(ngModel)]="toggle1">Toggle 1</mat-slide-toggle>
      <mat-slide-toggle [(ngModel)]="toggle2">Toggle 2</mat-slide-toggle>
      <mat-slide-toggle [(ngModel)]="toggle3">Toggle 3</mat-slide-toggle>
    </div>
    <div class="info-label">Toggle 1: {{ toggle1 }}</div>
    <div class="info-label">Toggle 2: {{ toggle2 }}</div>
    <div class="info-label">Toggle 3: {{ toggle3 }}</div>
  </mat-card>
</div>
