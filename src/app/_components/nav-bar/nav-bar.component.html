<div class="toolbar" *ngIf="isComponentShown">
    <mat-toolbar color="primary">
        <mat-toolbar-row class="content">
            <button mat-icon-button class="mobile-menu" (click)="openDrawer()" *ngIf="!isDrawer">
                <mat-icon>menu</mat-icon>
            </button>
            <span class="site-title">QA Automation Web</span>
            <span class="spacer"></span>
            <nav class="nav-links" *ngIf="!isDrawer">
                <a *ngFor="let link of navLinks"
                   mat-button
                   [routerLink]="link.path"
                   routerLinkActive="active-link"
                   [routerLinkActiveOptions]="{ exact: true }"
                   (click)="onNavLinkClick()">
                    <mat-icon>{{ link.icon }}</mat-icon>
                    {{ link.label }}
                </a>
            </nav>
            <div class="account">
                <mat-menu #appMenu="matMenu">
                    <ng-template matMenuContent let-name="name">
                        <button mat-menu-item id="settingsBtn">
                            Settings
                            <mat-icon>settings</mat-icon>
                        </button>
                        <button (click)="SignOut()" mat-menu-item id="signOutBtn">
                            Log off
                            <mat-icon>work_off</mat-icon>
                        </button>
                    </ng-template>
                </mat-menu>
                <button id="appMenu" mat-icon-button [matMenuTriggerFor]="appMenu">
                    <mat-icon md-36>account_circle</mat-icon>
                    <mat-label>{{ userName }}</mat-label>
                </button>
            </div>
        </mat-toolbar-row>
        <mat-toolbar-row class="content" *ngIf="!isDrawer">
            <span style="font-size: 12px;">Website for UI test automation practice.</span>
        </mat-toolbar-row>
    </mat-toolbar>
</div>

<!-- Drawer navigation for mobile -->
<div *ngIf="isDrawer" class="drawer-nav">
    <nav>
        <a *ngFor="let link of navLinks"
           mat-list-item
           [routerLink]="link.path"
           routerLinkActive="active-link"
           [routerLinkActiveOptions]="{ exact: true }"
           (click)="onNavLinkClick()">
            <mat-icon>{{ link.icon }}</mat-icon>
            {{ link.label }}
        </a>
        <button mat-list-item (click)="SignOut()">
            <mat-icon>work_off</mat-icon>
            Log off
        </button>
    </nav>
</div>
